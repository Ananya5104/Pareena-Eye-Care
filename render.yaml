# Render Blueprint: backend API + PostgreSQL. Frontend goes on Vercel.
databases:
  - name: pareena-db
    plan: free
    databaseName: pareena
    user: pareena

services:
  - type: web
    name: pareena-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi --workers 3 --timeout 60
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: pareena-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # e.g. https://pareena.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: STORAGE_BACKEND
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
      - key: DOCTOR_NOTIFICATION_EMAILS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
