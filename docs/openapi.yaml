          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Frame price. For sunglasses this includes the sun lenses.
        mrp:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Optional original price, shown struck out.
        image:
          type: string
          format: uri
          readOnly: true
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
          readOnly: true
        in_stock:
          type: boolean
          readOnly: true
        is_featured:
          type: boolean
        model_number:
          type: string
          maxLength: 60
        material:
          type: string
          description: e.g. Acetate, Metal, TR90
          maxLength: 60
        hinges:
          $ref: '#/components/schemas/HingesEnum'
        hinges_display:
          type: string
        frame_type_display:
          type: string
        weight_g:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Frame weight in grams.
        description:
          type: string
        lens_width_mm:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        bridge_width_mm:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        temple_length_mm:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
