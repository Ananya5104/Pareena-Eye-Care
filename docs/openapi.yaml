openapi: 3.0.3
info:
  title: Pareena Eye Care Center API
  version: 1.0.0
  description: Appointments, video consultations, frames store and orders.
paths:
  /api/v1/appointments/:
    get:
      operationId: api_v1_appointments_list
      description: Book an eye test (anyone) and list your own bookings (signed-in
        users).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
          description: ''
    post:
      operationId: api_v1_appointments_create
      description: Book an eye test (anyone) and list your own bookings (signed-in
        users).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/appointments/calendar/:
    get:
      operationId: api_v1_appointments_calendar_retrieve
      description: Bookable date window plus closed weekdays/dates, for the date picker.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCalendar'
          description: ''
  /api/v1/appointments/slots/:
    get:
      operationId: api_v1_appointments_slots_retrieve
      description: Time slots for one day, with availability.
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: YYYY-MM-DD
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaySlots'
          description: ''
  /api/v1/auth/code/:
    post:
      operationId: api_v1_auth_code_create
      description: Email a 6-digit sign-in code. Signing in with a new email creates
        the account.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestCodeRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: api_v1_auth_me_retrieve
      description: Current user. PATCH `name` and/or `phone`.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: api_v1_auth_me_partial_update
      description: Current user. PATCH `name` and/or `phone`.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: api_v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify/:
    post:
      operationId: api_v1_auth_verify_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/brands/:
    get:
      operationId: api_v1_brands_list
      parameters:
      - in: query
        name: is_featured
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brand'
          description: ''
  /api/v1/brands/{slug}/:
    get:
      operationId: api_v1_brands_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: ''
  /api/v1/clinic/:
    get:
      operationId: api_v1_clinic_retrieve
      description: Everything the Home and About pages need in a single request.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicInfo'
          description: ''
  /api/v1/consultations/:
    get:
      operationId: api_v1_consultations_list
      description: |-
        create:   Submit a video consultation request (multipart, up to 3 photos). Rate limited.
        retrieve: Check status by the reference UUID returned on create.
        list:     Your own requests (signed-in users only).
        lookup:   Statuses for several references at once (for guests' saved requests).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConsultationStatusList'
          description: ''
    post:
      operationId: api_v1_consultations_create
      description: |-
        create:   Submit a video consultation request (multipart, up to 3 photos). Rate limited.
        retrieve: Check status by the reference UUID returned on create.
        list:     Your own requests (signed-in users only).
        lookup:   Statuses for several references at once (for guests' saved requests).
      tags:
      - api
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsultationRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsultationRequestRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationRequest'
          description: ''
  /api/v1/consultations/{reference}/:
    get:
      operationId: api_v1_consultations_retrieve
      description: |-
        create:   Submit a video consultation request (multipart, up to 3 photos). Rate limited.
        retrieve: Check status by the reference UUID returned on create.
        list:     Your own requests (signed-in users only).
        lookup:   Statuses for several references at once (for guests' saved requests).
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationStatus'
          description: ''
  /api/v1/consultations/lookup/:
    get:
      operationId: api_v1_consultations_lookup_list
      description: |-
        create:   Submit a video consultation request (multipart, up to 3 photos). Rate limited.
        retrieve: Check status by the reference UUID returned on create.
        list:     Your own requests (signed-in users only).
        lookup:   Statuses for several references at once (for guests' saved requests).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: refs
        schema:
          type: string
        description: Comma-separated references (max 20)
        required: true
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConsultationStatusList'
          description: ''
  /api/v1/health/:
    get:
      operationId: api_v1_health_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/lens-types/:
    get:
      operationId: api_v1_lens_types_list
      description: Lens options. `?guide=true` returns only those shown on the Lens
        Guide page.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LensType'
          description: ''
  /api/v1/lens-types/{slug}/:
    get:
      operationId: api_v1_lens_types_retrieve
      description: Lens options. `?guide=true` returns only those shown on the Lens
        Guide page.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          description: 'The website draws a diagram for: single, blue, glare, photo,
            prog.'
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LensType'
          description: ''
  /api/v1/orders/:
    get:
      operationId: api_v1_orders_list
      description: Place orders (guest or signed-in), look them up by reference, and
        pay online.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
    post:
      operationId: api_v1_orders_create
      description: Place orders (guest or signed-in), look them up by reference, and
        pay online.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderWithPayment'
          description: ''
  /api/v1/orders/{reference}/:
    get:
      operationId: api_v1_orders_retrieve
      description: Place orders (guest or signed-in), look them up by reference, and
        pay online.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{reference}/pay/:
    post:
      operationId: api_v1_orders_pay_create
      description: Start (or retry) online payment for an unpaid order.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderWithPayment'
          description: ''
  /api/v1/orders/{reference}/pay-at-store/:
    post:
      operationId: api_v1_orders_pay_at_store_create
      description: Switch an unpaid online order to pay-at-store.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderWithPayment'
          description: ''
  /api/v1/orders/{reference}/payment-failed/:
    post:
      operationId: api_v1_orders_payment_failed_create
      description: Record that the customer's payment attempt failed or was abandoned.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderWithPayment'
          description: ''
  /api/v1/orders/{reference}/verify-payment/:
    post:
      operationId: api_v1_orders_verify_payment_create
      description: Place orders (guest or signed-in), look them up by reference, and
        pay online.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyPaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyPaymentRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderWithPayment'
          description: ''
  /api/v1/prescriptions/:
    get:
      operationId: api_v1_prescriptions_list
      description: Save an eyesight prescription (JSON, or multipart with `upload`).
        Retrieve by reference UUID.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPrescriptionList'
          description: ''
    post:
      operationId: api_v1_prescriptions_create
      description: Save an eyesight prescription (JSON, or multipart with `upload`).
        Retrieve by reference UUID.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PrescriptionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PrescriptionRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
          description: ''
  /api/v1/prescriptions/{reference}/:
    get:
      operationId: api_v1_prescriptions_retrieve
      description: Save an eyesight prescription (JSON, or multipart with `upload`).
        Retrieve by reference UUID.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
          description: ''
  /api/v1/products/:
    get:
      operationId: api_v1_products_list
      description: Frames & sunglasses. Filter by brand, category, gender, shape,
        frame_type, fit, price range.
      parameters:
      - in: query
        name: brand
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: string
          enum:
          - eyeglasses
          - sunglasses
        description: |-
          * `eyeglasses` - Eyeglasses (frames)
          * `sunglasses` - Sunglasses
      - in: query
        name: featured
        schema:
          type: boolean
      - in: query
        name: fit
        schema:
          type: string
          enum:
          - kids
          - large
          - medium
          - small
        description: |-
          * `small` - Small
          * `medium` - Medium
          * `large` - Large
          * `kids` - Kids
      - in: query
        name: frame_type
        schema:
          type: string
          enum:
          - full_rim
          - half_rim
          - rimless
        description: |-
          * `full_rim` - Full rim
          * `half_rim` - Half rim
          * `rimless` - Rimless
      - in: query
        name: gender
        schema:
          type: string
          enum:
          - kids
          - men
          - unisex
          - women
        description: |-
          * `men` - Men
          * `women` - Women
          * `unisex` - Unisex
          * `kids` - Kids
      - in: query
        name: max_price
        schema:
          type: number
      - in: query
        name: min_price
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: shape
        schema:
          type: string
          enum:
          - aviator
          - cat_eye
          - clubmaster
          - geometric
          - oval
          - rectangle
          - round
          - square
          - wayfarer
        description: |-
          * `round` - Round
          * `rectangle` - Rectangle
          * `square` - Square
          * `oval` - Oval
          * `cat_eye` - Cat-eye
          * `aviator` - Aviator
          * `wayfarer` - Wayfarer
          * `clubmaster` - Clubmaster
          * `geometric` - Geometric
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
  /api/v1/products/{slug}/:
    get:
      operationId: api_v1_products_retrieve
      description: Frames & sunglasses. Filter by brand, category, gender, shape,
        frame_type, fit, price range.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
  /api/v1/products/facets/:
    get:
      operationId: api_v1_products_facets_retrieve
      description: Filter options for the shop sidebar.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductFacets'
          description: ''
  /api/v1/reviews/:
    get:
      operationId: api_v1_reviews_retrieve
      description: Google rating and latest reviews, or null when not connected.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleReviews'
          description: ''
components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
          minLength: 2
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 254
        for_whom:
          type: string
          maxLength: 40
        reason:
          type: string
          maxLength: 120
          minLength: 3
        notes:
          type: string
          maxLength: 1000
        date:
          type: string
          format: date
        time:
          type: string
          format: time
        duration_minutes:
          type: integer
