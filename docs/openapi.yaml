      - image
    ProductList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 150
        brand:
          type: string
        brand_slug:
          type: string
        category:
          $ref: '#/components/schemas/CategoryEnum'
        gender:
          $ref: '#/components/schemas/GenderEnum'
        shape:
          $ref: '#/components/schemas/ShapeEnum'
        frame_type:
          $ref: '#/components/schemas/FrameTypeEnum'
        fit:
          $ref: '#/components/schemas/FitEnum'
        size_label:
          type: string
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
